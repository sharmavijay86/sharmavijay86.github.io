<!-- Share buttons -->
<div class="flex flex-wrap items-center gap-3 py-4 border-t border-slate-100 dark:border-slate-700/60 mt-4">
  <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Share</span>

  <a href="https://twitter.com/share?url={{ site.url }}{{ page.url | uri_escape }}&text={{ page.title | uri_escape }}"
     target="_blank" rel="noopener"
     class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-sky-50 dark:bg-sky-900/20 text-sky-600 dark:text-sky-400 hover:bg-sky-100 dark:hover:bg-sky-900/40 border border-sky-100 dark:border-sky-800/40 text-xs font-semibold transition-all">
    <i class="fab fa-twitter"></i> Twitter
  </a>

  <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ site.url }}{{ page.url | uri_escape }}&title={{ page.title | uri_escape }}"
     target="_blank" rel="noopener"
     class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/40 border border-blue-100 dark:border-blue-800/40 text-xs font-semibold transition-all">
    <i class="fab fa-linkedin-in"></i> LinkedIn
  </a>

  <a href="https://news.ycombinator.com/submitlink?u={{ site.url }}{{ page.url | uri_escape }}&t={{ page.title | uri_escape }}"
     target="_blank" rel="noopener"
     class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-orange-50 dark:bg-orange-900/20 text-orange-600 dark:text-orange-400 hover:bg-orange-100 dark:hover:bg-orange-900/40 border border-orange-100 dark:border-orange-800/40 text-xs font-semibold transition-all">
    <i class="fab fa-hacker-news"></i> HN
  </a>
</div>
